[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-regime-classification"
version = "0.1.0"
description = "Research-oriented market regime detector framework aligned with market-data-core"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Market Regime Research Team" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
market-regime = "market_regime_classification.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
